<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24" />
      <stop offset="100%" stop-color="#0D0D10" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF0033" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF0033" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF335C" />
      <stop offset="100%" stop-color="#FF0033" />
    </linearGradient>
    <g id="syncArc">
      <path d="M 30.7 53.2 A 35 35 0 0 1 97.5 53.8"
            fill="none"
            stroke="url(#arcGrad)"
            stroke-width="10"
            stroke-linecap="round" />
      <polygon points="100.5,61.5 107.2,49.8 87.8,55.2"
               fill="#FF0033"
               stroke="#FF0033"
               stroke-width="2.5"
               stroke-linejoin="round" />
    </g>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgGrad)" />
  <rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />

  <!-- Subtle Red Ambient Glow -->
  <circle cx="64" cy="64" r="46" fill="url(#centerGlow)" />

  <!-- Two Symmetric Sync Arcs -->
  <use href="#syncArc" />
  <use href="#syncArc" transform="rotate(180 64 64)" />

  <!-- Centered White Play Icon -->
  <polygon points="56,49 56,79 80,64"
           fill="#FFFFFF"
           stroke="#FFFFFF"
           stroke-width="3.5"
           stroke-linejoin="round" />
</svg>
